<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <title>Jurado de gallos</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="pila" id="pila">
      <!-- ───────────────────────── Inicio ───────────────────────── -->
      <section class="vista vista--activa" id="vista-inicio" aria-label="Inicio">
        <header class="barra">
          <div class="barra__fila"></div>
          <h1 class="titulo-grande">Jurado de gallos</h1>
        </header>

        <div class="vista__cuerpo">
          <form class="grupo" id="form-nueva">
            <p class="grupo__encabezado">Batalleros</p>
            <div class="tarjeta">
              <div class="fila">
                <label class="fila__etiqueta" for="nombre-a">A</label>
                <input
                  class="fila__campo"
                  id="nombre-a"
                  type="text"
                  placeholder="Batallero A"
                  autocomplete="off"
                  autocapitalize="words"
                  autocorrect="off"
                  spellcheck="false"
                  enterkeyhint="next"
                  maxlength="40"
                />
              </div>
              <div class="fila">
                <label class="fila__etiqueta" for="nombre-b">B</label>
                <input
                  class="fila__campo"
                  id="nombre-b"
                  type="text"
                  placeholder="Batallero B"
                  autocomplete="off"
                  autocapitalize="words"
                  autocorrect="off"
                  spellcheck="false"
                  enterkeyhint="go"
                  maxlength="40"
                />
              </div>
            </div>
            <p class="grupo__pie">
              Si dejas un nombre en blanco se usará «Batallero A» o «Batallero B».
            </p>

            <button class="boton boton--principal" type="submit">
              Empezar batalla
            </button>
          </form>
        </div>
      </section>

      <!-- ─────────────────────── Puntuación ─────────────────────── -->
      <section class="vista" id="vista-puntuacion" aria-label="Puntuación" inert>
        <header class="barra">
          <div class="barra__fila">
            <button class="barra__accion barra__accion--destructiva" type="button" id="btn-cancelar">
              Cancelar
            </button>
            <h2 class="barra__titulo">Puntuación</h2>
            <button class="barra__accion barra__accion--fuerte" type="button" id="btn-terminar">
              Terminar
            </button>
          </div>
        </header>

        <div class="vista__cuerpo vista__cuerpo--puntuacion">
          <div class="marcadores" role="group" aria-label="Marcadores">
            <button class="marcador" type="button" id="marcador-a" aria-pressed="true">
              <span class="marcador__nombre" id="marcador-a-nombre">Batallero A</span>
              <span class="marcador__total tabular" id="marcador-a-total">0</span>
              <span class="marcador__notas" id="marcador-a-notas">0 notas</span>
              <span class="marcador__secuencia" id="marcador-a-secuencia"></span>
            </button>
            <button class="marcador" type="button" id="marcador-b" aria-pressed="false">
              <span class="marcador__nombre" id="marcador-b-nombre">Batallero B</span>
              <span class="marcador__total tabular" id="marcador-b-total">0</span>
              <span class="marcador__notas" id="marcador-b-notas">0 notas</span>
              <span class="marcador__secuencia" id="marcador-b-secuencia"></span>
            </button>
          </div>

          <p class="turno" aria-live="polite" id="turno">Puntuando a Batallero A</p>
        </div>

        <div class="teclado" id="teclado">
          <button class="tecla" type="button" data-nota="0">0</button>
          <button class="tecla" type="button" data-nota="1">1</button>
          <button class="tecla" type="button" data-nota="2">2</button>
          <button class="tecla" type="button" data-nota="3">3</button>
          <button class="tecla" type="button" data-nota="4">4</button>
          <button
            class="tecla tecla--borrar"
            type="button"
            id="btn-borrar"
            aria-label="Borrar la última nota"
            disabled
          >
            <svg viewBox="0 0 26 20" aria-hidden="true" focusable="false">
              <path
                d="M8.4 1.2h14.1a2.3 2.3 0 0 1 2.3 2.3v13a2.3 2.3 0 0 1-2.3 2.3H8.4a2.3 2.3 0 0 1-1.7-.77L1.1 11.5a2.3 2.3 0 0 1 0-3L6.7 2a2.3 2.3 0 0 1 1.7-.8Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
              <path
                d="m11.9 7 6.2 6.2M18.1 7l-6.2 6.2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </section>

      <!-- ───────────────────────── Final ────────────────────────── -->
      <section class="vista" id="vista-final" aria-label="Resultado" inert>
        <header class="barra">
          <div class="barra__fila">
            <button class="barra__accion barra__accion--atras" type="button" id="btn-volver">
              <svg viewBox="0 0 12 20" aria-hidden="true" focusable="false">
                <path
                  d="M10 1 1.6 9.3a1 1 0 0 0 0 1.4L10 19"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              Puntuación
            </button>
            <h2 class="barra__titulo barra__titulo--oculto">Resultado</h2>
            <span class="barra__accion" aria-hidden="true"></span>
          </div>
          <h1 class="titulo-grande">Resultado</h1>
        </header>

        <div class="vista__cuerpo">
          <div class="grupo">
            <div class="tarjeta">
              <div class="resultado">
                <span class="resultado__nombre" id="final-a-nombre">Batallero A</span>
                <span class="resultado__total tabular" id="final-a-total">0</span>
              </div>
              <div class="fila fila--detalle">
                <span class="fila__etiqueta fila__etiqueta--suelta">Notas</span>
                <span class="fila__valor" id="final-a-secuencia">—</span>
              </div>
            </div>
          </div>

          <div class="grupo">
            <div class="tarjeta">
              <div class="resultado">
                <span class="resultado__nombre" id="final-b-nombre">Batallero B</span>
                <span class="resultado__total tabular" id="final-b-total">0</span>
              </div>
              <div class="fila fila--detalle">
                <span class="fila__etiqueta fila__etiqueta--suelta">Notas</span>
                <span class="fila__valor" id="final-b-secuencia">—</span>
              </div>
            </div>
          </div>

          <button class="boton boton--principal" type="button" id="btn-guardar">
            Guardar batalla
          </button>
          <p class="grupo__pie" id="aviso-guardar" role="status"></p>
        </div>
      </section>
    </div>

    <!-- ────────────────────── Diálogo de aviso ────────────────────── -->
    <div class="velo" id="velo" hidden>
      <div
        class="alerta"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="alerta-titulo"
        aria-describedby="alerta-texto"
      >
        <div class="alerta__cuerpo">
          <h2 class="alerta__titulo" id="alerta-titulo"></h2>
          <p class="alerta__texto" id="alerta-texto"></p>
        </div>
        <div class="alerta__acciones">
          <button
            class="alerta__boton alerta__boton--destructiva"
            type="button"
            id="alerta-si"
          ></button>
          <button class="alerta__boton" type="button" id="alerta-no"></button>
        </div>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
